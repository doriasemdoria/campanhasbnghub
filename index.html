<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campanhas BNG</title>
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#6b7280;--line:#e5e7eb;--card:#f7f8fa;--blue:#1d4ed8;--bluefg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9ca3af;--line:#262626;--card:#141414;--blue:#3b82f6;--bluefg:#fff}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9ca3af;--line:#262626;--card:#141414;--blue:#3b82f6;--bluefg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:600}h1 span{color:var(--blue)}
main{max-width:860px;margin:0 auto;padding:24px;display:grid;gap:20px}
section{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--card)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px;font-weight:600}
select,textarea,input{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
select:focus,textarea:focus,input:focus{outline:2px solid var(--blue);outline-offset:-1px}
textarea{min-height:160px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button.p{background:var(--blue);border-color:var(--blue);color:var(--bluefg);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{white-space:pre-wrap;font-size:13px;color:var(--mut);margin:12px 0 0;border-left:3px solid var(--blue);padding-left:12px}
.cols{margin-top:10px;font-size:12px;color:var(--mut);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.stats{color:var(--mut);font-size:13px}.stats b{color:var(--fg)}
.tw{overflow-x:auto;max-height:260px;overflow-y:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--bg)}
.new{display:none;margin-top:14px;gap:10px;grid-template-columns:1fr}.new.on{display:grid}
.ok{color:var(--blue)}label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}.hint{font-size:12px;color:var(--mut);margin-top:3px}
</style>
</head>
<body>
<header><h1>Campanhas <span>BNG</span></h1><button id="del" style="display:none">Excluir modelo</button></header>
<main>
<section>
  <h2>1 · Modelo</h2>
  <div class="row"><select id="tpl" style="flex:1;min-width:200px"></select><button id="add">+ Novo modelo</button></div>
  <div class="msg" id="txt"></div>
  <div class="cols" id="cols"></div>
  <div class="new" id="form">
    <input id="nn" placeholder="Nome do modelo (ex.: Plantão fim de semana)">
    <input id="nv" type="number" min="0" max="20" value="2" placeholder="Qtd. de variáveis">
    <textarea id="nt" style="min-height:90px" placeholder="Texto do modelo (use {{1}}, {{2}}...)"></textarea>
    <div class="row"><button class="p" id="save">Salvar modelo</button><button id="cancel">Cancelar</button></div>
  </div>
</section>
<section>
  <h2>2 · Preenchimento</h2>
  <div id="vars" style="display:grid;gap:10px"></div>
  <div class="msg" id="pv" style="display:none"></div>
</section>
<section>
  <h2>3 · Números</h2>
  <textarea id="inp" placeholder="Um por linha. Opcional: número;nome&#10;11999998888&#10;(21) 98888-7777;Dr. João"></textarea>
  <p class="stats" id="stats">Cole os números acima. O 55 é adicionado automaticamente e espaços/símbolos são removidos.</p>
  <div class="row"><label style="margin:0;display:flex;align-items:center;gap:6px;color:var(--fg)"><input id="nu" type="checkbox" checked style="width:auto"> Remover coluna Username</label><label style="margin:0">Números por CSV</label><input id="cs" type="number" min="1" max="100" value="100" style="width:80px"><button class="p" id="dl" disabled>Baixar CSV</button><button id="copy" disabled>Copiar números</button><button id="clr">Limpar</button></div>
  <div class="tw" id="tw" style="display:none"></div>
</section>
</main>
<script>
const DEF=[
{n:"Iniciar conversa",l:["Nome do médico","Assunto"],h:["Nome","Telefone","Username","nome_medico","assunto"],t:"Olá, doutor(a), {{1}}! Tudo bem? {{2}} Fico no aguardo do seu retorno!"},
{n:"Captação simples",l:["Nome do médico","Especialidade","Região"],h:["Nome","Telefone","Username","{{1}}","{{2}}","{{3}}"],t:"Olá, Dr(a). {{1}}! Tudo bem? 😃👋 Somos do time de Escalas da *BNG Hub* ⚕️💙. Identificamos o seu perfil e temos ótimas oportunidades para a sua especialidade: {{2}}. As vagas são para atuar na região de {{3}}. O(A) senhor(a) possui disponibilidade na agenda para avaliar os valores e horários? Caso não atue nessa região, você também pode indicar um colega."},
{n:"Acionar vaga urgente",l:["Nome do médico","Unidade","Setor","Condições (data e valor)"],h:["Nome","Telefone","Username","{{1}}","{{2}}","{{3}}","{{4}}"],t:"Olá, Dr(a). {{1}}! Tudo bem? 😃👋 Surgiu uma oportunidade de última hora na unidade {{2}}, para atuar no setor de {{3}}, com as seguintes condições: 🗓️💰 {{4}} Consegue nos ajudar ou indicar um colega para esta vaga? _Time_ *BNG Hub* 💙"}
];
const $=id=>document.getElementById(id);
let custom=[],rows=[],vals={};
try{custom=JSON.parse(localStorage.getItem("bng_tpls")||"[]")}catch(e){}
const all=()=>DEF.concat(custom);
function persist(){try{localStorage.setItem("bng_tpls",JSON.stringify(custom))}catch(e){}}
function renderTpl(sel){
  const a=all();const prev=$("tpl").value;
  $("tpl").innerHTML=a.map((t,i)=>`<option value="${i}">${t.n.replace(/</g,"&lt;")}</option>`).join("");
  $("tpl").value=sel!=null?sel:(prev||"0");
  const t=a[+$("tpl").value];$("txt").textContent=t.t;$("cols").textContent=t.h.join(";");
  $("del").style.display=+$("tpl").value>=DEF.length?"":"none";
  renderVars();renderRows();
}
function idx(t){return t.h.map((h,i)=>i).filter(i=>!(i==2&&$("nu").checked))}
function nv(t){return Math.max(0,t.h.length-3)}
function key(){const t=all()[+$("tpl").value];return t.n}
function renderVars(){
  const t=all()[+$("tpl").value],v=vals[key()]=vals[key()]||{};
  $("vars").innerHTML=Array.from({length:nv(t)},(_,i)=>{
    const lab=(t.l&&t.l[i])||("Variável "+(i+1));
    return `<div><label>{{${i+1}}} · ${lab.replace(/</g,"&lt;")}</label>${i>=1&&(t.l&&t.l[i]||"").length>45?"":""}<input data-i="${i}" value="${(v[i]||"").replace(/"/g,"&quot;")}" placeholder="${i==0?"Vazio = usa o nome informado em cada linha":"Aplicado a todos os números"}"></div>`}).join("")||'<p class="hint">Este modelo não tem variáveis.</p>';
  $("vars").querySelectorAll("input").forEach(e=>e.oninput=()=>{vals[key()][e.dataset.i]=e.value;renderRows()});
}
function clean(x){return String(x||"").replace(/[\r\n]+/g," ").replace(/;/g,",").trim()}
function cell(t,r,i){
  if(i==0)return clean(r.nome);if(i==1)return r.num;if(i==2)return "";
  const k=i-3,v=vals[key()]||{};
  if(k==0)return clean(r.nome||v[0]);
  return clean(v[k]);
}
function norm(raw){
  let d=raw.replace(/\D/g,"");
  if(!d)return "";
  if(!(d.startsWith("55")&&d.length>=12))d="55"+d;
  return d;
}
function parse(){
  const seen=new Set();let dup=0,bad=0;rows=[];
  $("inp").value.split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const m=l.split(/[;\t,]/);const num=norm(m[0]);const nome=(m[1]||"").trim();
    if(num.length<12||num.length>13){bad++;return}
    if(seen.has(num)){dup++;return}
    seen.add(num);rows.push({num,nome});
  });
  return {dup,bad};
}
function renderRows(){
  const {dup,bad}=parse(),t=all()[+$("tpl").value];
  const has=$("inp").value.trim();$("cols").textContent=idx(t).map(i=>t.h[i]).join(";");
  $("stats").innerHTML=has?`<b>${rows.length}</b> número(s) válido(s)`+(dup?` · ${dup} duplicado(s) removido(s)`:"")+(bad?` · <span class="ok">${bad} inválido(s) ignorado(s)</span>`:""):"Cole os números acima. O 55 é adicionado automaticamente e espaços/símbolos são removidos.";
  const v=vals[key()]||{};
  const missing=[];for(let i=1;i<nv(t);i++)if(!(v[i]||"").trim())missing.push("{{"+(i+1)+"}}");
  const noName=nv(t)>0&&!(v[0]||"").trim()?rows.filter(r=>!r.nome).length:0;
  let warn="";if(rows.length&&missing.length)warn+=` · <span class="ok">Falta preencher ${missing.join(", ")}</span>`;
  if(noName)warn+=` · <span class="ok">${noName} linha(s) sem nome do médico</span>`;
  $("stats").innerHTML+=warn;
  $("dl").disabled=!rows.length||missing.length>0||noName>0;$("copy").disabled=!rows.length;
  const nf=Math.ceil(rows.length/size());$("dl").textContent=nf>1?`Baixar ZIP (${nf} CSVs)`:"Baixar CSV";
  const pv=$("pv");
  if(rows.length&&nv(t)){let m=t.t;for(let i=0;i<nv(t);i++)m=m.split("{{"+(i+1)+"}}").join(cell(t,rows[0],i+3)||"{{"+(i+1)+"}}");pv.style.display="";pv.textContent="Prévia (1º número):\n"+m}else pv.style.display="none";
  const tw=$("tw");
  if(!rows.length){tw.style.display="none";return}
  tw.style.display="";
  tw.innerHTML="<table><tr>"+idx(t).map(i=>`<th>${t.h[i].replace(/</g,"&lt;")}</th>`).join("")+"</tr>"+
    rows.slice(0,100).map(r=>"<tr>"+idx(t).map(i=>`<td>${cell(t,r,i).replace(/</g,"&lt;")}</td>`).join("")+"</tr>").join("")+
    (rows.length>100?`<tr><td colspan="${idx(t).length}">… +${rows.length-100} linhas no arquivo</td></tr>`:"")+"</table>";
}
$("tpl").onchange=()=>renderTpl();
$("inp").oninput=renderRows;
$("clr").onclick=()=>{$("inp").value="";renderRows()};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(rows.map(r=>r.num).join("\n"));$("copy").textContent="Copiado ✓";setTimeout(()=>$("copy").textContent="Copiar números",1500)}catch(e){}};
function size(){return Math.max(1,Math.min(100,parseInt($("cs").value)||100))}
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.data),c=crc(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,c,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,c,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nm);
    off+=30+nm.length+data.length;
  });
  let cs=0;cen.forEach(x=>cs+=x.byteLength||x.length);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:"application/zip"});
}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$("cs").oninput=renderRows;$("nu").onchange=renderRows;
$("dl").onclick=()=>{
  const t=all()[+$("tpl").value],n=size(),base=t.n.toUpperCase().replace(/\s+/g,"_");
  const mk=ch=>"\ufeff"+[idx(t).map(i=>t.h[i]).join(";")].concat(ch.map(r=>idx(t).map(i=>cell(t,r,i)).join(";"))).join("\r\n");
  const chunks=[];for(let i=0;i<rows.length;i+=n)chunks.push(rows.slice(i,i+n));
  if(chunks.length==1)return save(new Blob([mk(chunks[0])],{type:"text/csv;charset=utf-8"}),base+".csv");
  const pad=String(chunks.length).length,stamp=new Date().toISOString().slice(0,10);
  save(zip(chunks.map((c,i)=>({name:`${base}_${String(i+1).padStart(Math.max(pad,2),"0")}.csv`,data:mk(c)}))),`${base}_${stamp}.zip`);
};
$("add").onclick=()=>$("form").classList.toggle("on");
$("cancel").onclick=()=>$("form").classList.remove("on");
$("save").onclick=()=>{
  const n=$("nn").value.trim(),t=$("nt").value.trim(),v=Math.max(0,Math.min(20,+$("nv").value||0));
  if(!n||!t)return;
  const h=["Nome","Telefone","Username"];for(let i=1;i<=v;i++)h.push("{{"+i+"}}");
  custom.push({n,h,t});persist();$("form").classList.remove("on");
  $("nn").value=$("nt").value="";renderTpl(all().length-1);
};
$("del").onclick=()=>{const i=+$("tpl").value-DEF.length;if(i>=0&&confirm("Excluir este modelo?")){custom.splice(i,1);persist();renderTpl(0)}};
renderTpl(0);
</script>
</body>
</html>
